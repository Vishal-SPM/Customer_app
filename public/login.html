<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EATs Voucher — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
    }
    .brand-name { font-size: 18px; font-weight: 700; color: #f8fafc; }
    .brand-sub  { font-size: 12px; color: #64748b; }
    h2 { font-size: 22px; font-weight: 700; color: #f8fafc; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #64748b; margin-bottom: 28px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; letter-spacing: .4px; text-transform: uppercase; }
    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 14px;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      margin-bottom: 18px;
      transition: border-color .15s;
    }
    input:focus { border-color: #6366f1; }
    button {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity .15s;
    }
    button:hover { opacity: .9; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .error {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <div class="brand-icon">✦</div>
    <div>
      <div class="brand-name">EATs Voucher</div>
      <div class="brand-sub">Admin Dashboard</div>
    </div>
  </div>

  <h2>Sign in</h2>
  <p class="sub">Internal access only. Contact your administrator for an account.</p>

  <div id="error-msg" class="error"></div>

  <form id="login-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>

    <button type="submit" id="btn-login">Sign in</button>
  </form>
</div>

<script>
  // If already logged in and token not expired, go to dashboard
  (function() {
    const token = localStorage.getItem('eats_token');
    if (token) {
      try {
        const p = JSON.parse(atob(token.split('.')[1]));
        if (p.exp * 1000 > Date.now()) { window.location.href = '/'; }
      } catch {}
    }
  })();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    const err = document.getElementById('error-msg');
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const res  = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      localStorage.setItem('eats_token', data.token);
      window.location.href = '/';
    } catch (ex) {
      err.textContent   = ex.message;
      err.style.display = 'block';
      btn.disabled      = false;
      btn.textContent   = 'Sign in';
    }
  });
</script>
</body>
</html>
